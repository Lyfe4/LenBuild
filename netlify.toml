[build]
  base    = "lenbuild"
  command = "npm run build"
  publish = "build"

# Every real route is prerendered to its own folder by react-snap, so anything
# else is genuinely missing: serve the prerendered 404 page with a 404 status.
[[redirects]]
  from = "/*"
  to   = "/404.html"
  status = 404
